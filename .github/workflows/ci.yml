name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (PHP 8.4)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/app?serverVersion=18&charset=utf8"

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Auditoria de vulnerabilidades
        run: composer audit

      - name: Padrão de código (PHP CS Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Análise estática (PHPStan)
        run: |
          php bin/console cache:warmup --env=dev
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      
      - name: Documentação OpenAPI atualizada
        run: |
          php bin/console nelmio:apidoc:dump --format=json > /tmp/openapi.json
          diff -u ../docs/openapi.json /tmp/openapi.json

      - name: Preparar ambiente de testes
        run: |
          php bin/console lexik:jwt:generate-keypair
          php bin/console --env=test doctrine:database:create --if-not-exists
          php bin/console --env=test doctrine:migrations:migrate --no-interaction

      - name: Testes (PHPUnit)
        run: vendor/bin/phpunit

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de vulnerabilidades
        run: npm audit --audit-level=high

      - name: Tipos da API sincronizados com o OpenAPI
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tipos e build de produção
        run: npm run build
